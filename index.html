function buildHtml(){
  const c=document.documentElement.cloneNode(true);
  c.removeAttribute('data-theme');c.setAttribute('lang','uk');c.querySelector('title').textContent=D.profile.name+' — сайти та лендинги';c.querySelector('#app').innerHTML='';c.querySelector('#ui').innerHTML='';
  c.querySelector('#data').textContent=JSON.stringify(API?{...D,reviews:[]}:D).replace(/</g,'\\u003c');
  return '<!doctype html>\n'+c.outerHTML;
}
async function save(){
  if(!art)throw new Error('Зберігати можна лише зі свого акаунта claude.ai (відкрийте сторінку, увійшовши в нього)');
  await art.publish(buildHtml());
}
const say=t=>{const m=$('#msg');if(m)m.textContent=t};
async function up(file){
  if(!assets)throw new Error('Завантаження файлів недоступне для вашого облікового запису');
  if(file.size>20*1024*1024)throw new Error('Файл більший за 20 МБ — вставте посилання замість нього');
  return (await assets.upload(file)).url;
}

document.addEventListener('click',async e=>{
  const t=e.target;
  if(t.dataset.close&&(t.classList.contains('ov')||t.tagName==='BUTTON'))return close();
  if(t.closest('[data-tg]')){const r=document.documentElement,n=(r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'))==='dark'?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('th',n)}catch{}return}
  const a=t.closest('[data-a]');
  if(a){const k=a.dataset.a;if(k==='add')return addForm();if(k==='rev')return revForm();if(k==='prof')return profForm();if(k==='login')return loginForm();if(k==='out'){admin=false;adminKey='';try{sessionStorage.removeItem('ak')}catch{}try{sessionStorage.removeItem('adm')}catch{}return render()}}
  const f=t.closest('[data-f]');
  if(f){flt=f.dataset.f;return render()}
  if(t.closest('[data-pubrev]'))return pubRevForm();
  const cp=t.closest('[data-copy]');
  if(cp){const val=cp.dataset.copy,o=cp.textContent,done=()=>{cp.textContent=L==='en'?'Copied ✓':'Скопійовано ✓';setTimeout(()=>{cp.textContent=o},1600)};
    try{await navigator.clipboard.writeText(val);done()}catch{const a=document.createElement('textarea');a.value=val;document.body.append(a);a.select();try{document.execCommand('copy');done()}catch{}a.remove()}return}
  const ed=t.closest('[data-edit]');
  if(ed){const w=D.works.find(w=>w.id===ed.dataset.edit);if(w)addForm(w);return}
  const lg=t.closest('[data-lang]');
  if(lg){L=L==='en'?'uk':'en';try{localStorage.setItem('lang',L)}catch{}render();return}
  const dr=t.closest('[data-delr]');
  if(dr){
    if(!dr.dataset.armed){dr.dataset.armed=1;dr.textContent='Точно?';setTimeout(()=>{dr.dataset.armed='';dr.textContent='Видалити'},3000);return}
    const bk=D.reviews;D.reviews=bk.filter(r=>r.id!==dr.dataset.delr);dr.disabled=true;
    try{if(API){await apiCall({action:'del',id:dr.dataset.delr,key:adminKey});render()}else await save()}catch(x){D.reviews=bk;toast(x.message);render()}
    return;
  }
  const d=t.closest('[data-del]');
  if(d){
    if(!d.dataset.armed){d.dataset.armed=1;d.textContent='Точно?';setTimeout(()=>{d.dataset.armed='';d.textContent='Видалити'},3000);return}
    const bk=D.works;D.works=bk.filter(w=>w.id!==d.dataset.del);d.disabled=true;
    try{if(API&&GH){const r=await apiCall({action:'workDel',key:adminKey,id:d.dataset.del});D.works=r.works;render()}else await save()}catch(x){D.works=bk;toast(x.message);render()}
    return;
  }
  const c=t.closest('.card');
  if(c)location.hash='w-'+c.dataset.id
});
document.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=e.target,v=f.elements,btn=f.querySelector('[type=submit]');
  if(f.id==='m'){const a=document.createElement('a');a.href='mailto:'+D.profile.email+'?subject='+encodeURIComponent('Запит з портфоліо від '+v.nm.value)+'&body='+encodeURIComponent(v.msg.value);a.click();return}
  if(f.id==='cr'){
    btn.disabled=true;
    try{
      if(v.hp.value)return;
      let last=0;try{last=+localStorage.getItem('rv_t')||0}catch{}
      if(Date.now()-last<60000)throw new Error(tt('Зачекайте хвилину перед наступним відгуком','Please wait a minute before sending another review'));
      if(!API){const m=`Відгук для сайту\nІм’я: ${v.nm.value.trim()}\nХто: ${v.role.value.trim()||'—'}\nВідгук: ${v.tx.value.trim()}`,a=document.createElement('a');a.href='https://t.me/'+(tgName(D.profile.telegram)||'sydr00')+'?text='+encodeURIComponent(m);a.target='_blank';a.rel='noopener';a.click();try{localStorage.setItem('rv_t',Date.now())}catch{}modal(`<h2>${tt('Майже готово','Almost done')}</h2><p>${tt('Відкрилось вікно Telegram з вашим відгуком. Натисніть «Надіслати» — і я додам його на сайт.','Telegram opened with your review. Press “Send” and I will add it to the site.')}</p><div class="row"><button data-close="1">OK</button></div>`);return}
      const r=await apiCall({action:'add',name:v.nm.value.trim(),role:v.role.value.trim(),text:v.tx.value.trim()});
      try{localStorage.setItem('rv_t',Date.now())}catch{}
      D.reviews.unshift(r.review);render();
      modal(`<h2>${tt('Дякуємо!','Thank you!')}</h2><p>${tt('Ваш відгук додано.','Your review has been added.')}</p><div class="row"><button data-close="1">OK</button></div>`);
    }catch(x){say(tt('Помилка: ','Error: ')+(x.message||x));btn.disabled=false}
    return;
  }
  if(f.id==='r'){btn.disabled=true;try{D.reviews.unshift({id:Date.now().toString(36),name:v.nm.value.trim(),role:v.role.value.trim(),text:v.tx.value.trim()});say('Публікація…');await save()}catch(x){D.reviews.shift();say('Помилка: '+(x.message||x.code||x));btn.disabled=false}return}
  if(f.id==='l'){
    if(await sha(v.pw.value)===PH){admin=true;adminKey=v.pw.value;try{sessionStorage.setItem('ak',adminKey)}catch{}try{sessionStorage.setItem('adm','1')}catch{}close();render()}
    else say('Невірний пароль');
    return;
  }
  btn.disabled=true;let added=null,restore=null;
  try{
    if(f.id==='p'){
      Object.assign(D.profile,Object.fromEntries(['name','tagline','about','email','social','telegram','phone','skills','services','timeline','about_en','tagline_en','services_en'].map(k=>[k,v[k].value.trim()])));
    }else{
      const ed=v.eid.value?D.works.find(w=>w.id===v.eid.value):null;
      if(API&&GH){
        let url=v.url.value.trim();if(url&&!/^https?:\/\//i.test(url))url='https://'+url;
        if(!url)throw new Error('Вкажіть посилання');
        let cover=v.coverurl.value.trim();if(v.coverfile.files[0]){say('Стискаю зображення…');cover=await shrink(v.coverfile.files[0])}else if(!cover&&ed)cover=ed.cover||'';
        const o={title:v.title.value.trim(),desc:v.desc.value.trim(),tags:v.tags.value.split(',').map(x=>x.trim()).filter(Boolean),kind:v.kind.value,url,cover};
        say('Збереження…');const r=await apiCall({action:ed?'workUpdate':'workAdd',key:adminKey,id:ed?ed.id:'',work:o});
        D.works=r.works;close();render();
        const sv=ed?r.works.find(x=>x.id===ed.id):r.works[0];
        if(cover&&sv&&(sv.cover||'').length<cover.length)toast('Роботу збережено, але Google обрізав обкладинку: у вашому коді Google ще стара версія (ліміт 500 символів). Вставте оновлений код і створіть «Новое развертывание».');
        return;
      }
      let url=v.url.value.trim(),isUp=ed&&url===ed.url?ed.up:false,cover=ed?ed.cover:'';
      if(url&&!/^(https?:\/\/|\/_blob\/)/i.test(url))url='https://'+url;
      if(v.file.files[0]){say('Завантаження файлу…');url=await up(v.file.files[0]);isUp=true}
      if(v.cover.files[0]){say('Завантаження обкладинки…');cover=await up(v.cover.files[0])}
      if(!url)throw new Error('Вкажіть посилання або виберіть файл');
      const o={title:v.title.value.trim(),desc:v.desc.value.trim(),tags:v.tags.value.split(',').map(s=>s.trim()).filter(Boolean),kind:v.kind.value,url,up:isUp,cover};
      if(ed){const bk={...ed};restore=()=>Object.assign(ed,bk);Object.assign(ed,o)}
      else{added={id:Date.now().toString(36),...o};D.works.unshift(added)}
    }
    say('Публікація…');await save();
  }catch(x){say('Помилка: '+(x.message||x.code||x));btn.disabled=false;if(added)D.works=D.works.filter(w=>w!==added);if(restore)restore()}
});
const PH='4f9b1b4e1676e2ce93b93587f79c3a0a190710a629c8e81b0a81f8111fb375a3';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let tm;
function fx(){
  clearTimeout(tm);document.querySelectorAll('.rv').forEach(e=>io.observe(e));
  const el=$('.tag'),ws=D.profile.tagline.split('|').map(s=>s.trim()).filter(Boolean);
  if(el&&ws.length){let i=0,j=0,del=false;
    const step=()=>{const w=ws[i%ws.length];el.textContent=w.slice(0,j);
      if(!del&&j===w.length){if(ws.length<2)return;del=true;tm=setTimeout(step,1400);return}
      if(del&&j===0){del=false;i++}
      j+=del?-1:1;tm=setTimeout(step,del?35:70)};step()}
  document.querySelectorAll('[data-n]').forEach(b=>{const n=+b.dataset.n;let k=0;const t=setInterval(()=>{k++;b.textContent=Math.round(n*k/20);if(k>=20)clearInterval(t)},40)});

}
